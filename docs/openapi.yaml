  /api/v1/requests/:
    get:
      operationId: requests_list
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: needs_my_action
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - medium
        description: |-
          * `low` - Low
          * `medium` - Medium
          * `high` - High
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - approved
            - completed
            - draft
            - in_review
            - rejected
            - submitted
        description: |-
          * `draft` - Draft
          * `submitted` - Submitted
          * `in_review` - In review
          * `approved` - Approved
          * `rejected` - Rejected
          * `completed` - Completed
        explode: true
        style: form
      tags:
      - requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRequestListList'
          description: ''
    post:
      operationId: requests_create
      tags:
      - requests
      requestBody:
        content:
