            - approved
            - completed
            - draft
            - in_review
            - rejected
            - submitted
        description: |-
          * `draft` - Draft
          * `submitted` - Submitted
          * `in_review` - In review
          * `approved` - Approved
          * `rejected` - Rejected
          * `completed` - Completed
        explode: true
        style: form
      tags:
      - requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
          description: ''
    post:
      operationId: requests_attachments_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this request.
        required: true
      tags:
      - requests
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
        '413':
          description: Body larger than the limit
  /api/v1/requests/{id}/attachments/{attachment_id}/:
    delete:
      operationId: requests_attachments_destroy
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this request.
        required: true
      tags:
      - requests
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/requests/{id}/attachments/{attachment_id}/download/:
