          additionalProperties:
            type: integer
        needs_my_action:
          type: integer
        recent:
          type: array
          items:
            $ref: '#/components/schemas/RequestList'
      required:
      - by_priority
      - by_status
      - needs_my_action
      - recent
      - total
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        user_count:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - user_count
    DepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    DepartmentSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
