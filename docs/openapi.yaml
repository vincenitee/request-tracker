      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - reviewer
          - staff
        description: |-
          * `staff` - Staff
          * `reviewer` - Reviewer
          * `admin` - Admin
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: users_create
      description: 'Admin user management. No DELETE: deactivate with is_active=false
        instead.'
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWrite'
          description: ''
  /api/v1/users/{id}/:
    get:
      operationId: users_retrieve
      description: 'Admin user management. No DELETE: deactivate with is_active=false
        instead.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_partial_update
      description: 'Admin user management. No DELETE: deactivate with is_active=false
        instead.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWrite'
          description: ''
  /api/v1/users/{id}/set-password/:
    post:
      operationId: users_set_password_create
      description: 'Admin user management. No DELETE: deactivate with is_active=false
        instead.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        original_name:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        uploaded_by:
          allOf:
          - $ref: '#/components/schemas/Requester'
          readOnly: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        can_delete:
          type: boolean
          readOnly: true
      required:
      - can_delete
      - content_type
      - id
      - original_name
      - size
      - uploaded_at
      - uploaded_by
    AttachmentUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
      required:
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        is_active:
          type: boolean
      required:
      - name
    CategorySummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/Requester'
          readOnly: true
        body:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
          readOnly: true
        can_delete:
          type: boolean
          readOnly: true
      required:
      - author
      - body
      - can_delete
      - created_at
      - id
    CommentRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - body
    DashboardSummary:
      type: object
      description: Shape of GET /dashboard/summary/ (built by services.dashboard_summary).
